[workspace]
default-members = ["crates/sdk"]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Puzzled <support@pzzld.org>"]
categories = ["developer-tools"]
description = "A semver toolkit for Rust"
edition = "2024"
homepage = "https://github.com/FL03/bumper"
keywords = ["versioning", "semver"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/FL03/bumper.git"
rust-version = "1.97.0"
version = "0.0.1"

[workspace.dependencies]
bumper-cli = { path = "crates/cli", version = "0.0.1" }
bumper-sdk = { path = "crates/sdk", version = "0.0.1" }
# cli
clap = { version = "4" }
# parsing
nom = { default-features = false, version = "8" }
# mathematics
num-traits = { default-features = false, version = "0.2" }
# serialization
serde = { default-features = false, features = ["derive"], version = "1" }
serde_derive = { default-features = false, version = "1" }
serde_json = { default-features = false, version = "1" }
# macros & utilities
strum = { default-features = false, features = ["derive"], version = "0.28" }
# errors
anyhow = { default-features = false, version = "1" }
thiserror = { default-features = false, version = "2" }

# ********* Profiles *********
[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 1
overflow-checks = true
rpath = false
strip = false

[profile.release]
codegen-units = 16
debug = false
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 2
overflow-checks = false
panic = "unwind"
rpath = false
strip = true

[profile.native-dev]
inherits = "dev"

[profile.wasi-dev]
inherits = "dev"
lto = "thin"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = true
